<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice rehearsal</title><style>body{margin:auto;max-width:480px;padding:24px;background:#f3f7f4;color:#193532;font:16px system-ui}main{background:white;padding:24px;border-radius:24px}h1{font-size:32px}.cue{background:#dcebe5;padding:16px;border-radius:16px;font-size:19px}button{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:#274f48;color:white;font-weight:700;font-size:16px}.alt{background:#e5eeea;color:#274f48}button:disabled{opacity:.5}.ring{margin:20px auto;width:155px;height:155px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#6f9589 0deg,#e2ebe6 0);font-size:42px;font-weight:800}.status,.help,small{display:block;text-align:center;color:#607570;font-size:13px;margin:10px}.status{font-size:11px;text-transform:uppercase;letter-spacing:.1em}audio{width:100%;margin-top:12px}</style><main><small>VOICE RECORDING GUIDE</small><h1>Record the welcome</h1><p class="cue">“Welcome. Take a moment to settle. There is nowhere else you need to be.”</p><p><b>Target: 10 seconds</b><br>Warm and unhurried, with small pauses.</p><div class="ring" id="ring">10</div><div class="status" id="s">Ready</div><button class="alt" id="allow">Allow microphone</button><button id="go">Record with 3-second countdown</button><button class="alt" id="play" disabled>Listen back</button><div id="out"></div><p class="help" id="h">Allow microphone, approve the browser prompt, then record.</p><small>Your recording remains in this browser.</small></main><script>let stream,rec,chunks=[],audio,busy=false;let A=allow,G=go,P=play,S=s,H=h,R=ring;function show(n,t=10,c="#6f9589"){R.textContent=Math.max(0,n);R.style.background=`conic-gradient(${c} ${Math.max(0,(t-n)/t*360)}deg,#e2ebe6 0)`}async function mic(){if(!navigator.mediaDevices){S.textContent="Not supported";return}A.disabled=true;H.textContent="Choose Allow in your browser prompt.";try{stream=await navigator.mediaDevices.getUserMedia({audio:true});A.textContent="Microphone allowed";S.textContent="Ready";H.textContent="Microphone is ready."}catch(e){A.disabled=false;S.textContent="Microphone needed";H.textContent="Enable microphone for this site in browser settings."}}function run(){let n=10;rec.start();S.textContent="Speak now";G.textContent="Recording…";let x=setInterval(()=>{show(--n,10,"#b44c4c");if(!n){clearInterval(x);S.textContent="Finishing";setTimeout(()=>rec.stop(),1000)}},1000)}async function start(){if(busy)return;G.disabled=true;if(!stream)await mic();if(!stream){G.disabled=false;return}rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());stream=null;audio=document.createElement("audio");audio.controls=true;audio.src=URL.createObjectURL(new Blob(chunks));out.replaceChildren(audio);P.disabled=false;A.disabled=false;A.textContent="Allow microphone";S.textContent="Done";H.textContent="Your take is ready.";G.disabled=false;G.textContent="Record again";busy=false};chunks=[];busy=true;let n=3;S.textContent="Get ready";G.textContent="Countdown…";let x=setInterval(()=>{show(n,3);if(!n){clearInterval(x);run()}n--},1000)}A.onclick=mic;G.onclick=start;P.onclick=()=>{audio.play();H.textContent="Listening back."}</script>
